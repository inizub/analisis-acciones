# Parámetros versionados del plugin. Cambiar un valor exige subir `version`.
version: 4
modelos: {datos: sonnet, analista: sonnet, forense: sonnet, red_team_fallback: sonnet, juez: opus}
red_team_externo: {proveedor: gemini, modelo: "<configurar>", activo: false}
eventos: {E0_meses: 6, E1_meses: 12, E2_meses: 36, E3_caida: -0.30, benchmark: VWCE.DE, moneda: EUR}
# k: peso de los escenarios del analista frente al escenario neutral (precio = valor) en la simulación de
# escenarios.py. tasa_base_exceso: baseline B0 de la puntuación y respaldo para salidas antiguas.
agregacion: {tasa_base_exceso: 0.45, k: 0.4, clip_E3_E4: [0.05, 0.95]}
veredicto: {atractiva_p_E1: 0.55, atractiva_exceso_pp: 5, atractiva_max_perdida_bear: 0.50, no_atractiva_p_E1: 0.40, z_no_atractiva: 3}
escenarios: {T_conv_anios: 3, mc_sims: 100000, t_nu: 4, semilla: 42}
# Cordura del modelo: si el precio queda a más de este factor del rango de valores de los escenarios (todos muy por debajo
# o muy por encima), el resultado depende mucho de los supuestos. Con bloquea: false es un aviso visible en el resumen;
# con bloquea: true el checklist (punto 12) lo cierra como no_analizable y el flujo salta red team y juez.
cordura: {factor_precio_fuera_de_rango: 2.0, bloquea: false}
# Construcción de la base de valoración (motor/inicial.py). Parámetros de modelo, no datos de la empresa.
motor:
  g_terminal_max: 0.03            # g terminal = min(Rf, este valor)
  tasa_impuestos_defecto: 0.25    # solo si Damodaran no da el tipo del país
  anios_convergencia_margen: 5
  ventas_capital_rango: [0.2, 10]
  roc_rango: [0.03, 0.5]
  rnpv:                           # heurísticos: el analista los corrige con sus drivers
    margen: 0.35
    anios_hasta_lanzamiento: {I: 7, II: 5, III: 3, NDA: 1}
    anios_rampa: 5
    anios_meseta: 5
    anios_declive: 3
    fraccion_quema_generales: 0.3
    anios_gastos_generales: 5
tasas_base_k: {crecimiento_ventas: 0.3, margen_operativo: 0.6, roic_roe: 0.6, margen_bruto: 0.8}
forense: {fco_bn_min: 0.8, devengos_max: 0.10, cxc_gap_pp: 10, inv_gap_pp: 10, sbc_max: 0.10, dilucion_max: 0.03, goodwill_max: 0.40, cobertura_min: 3,
          gap_anios: 2, dilucion_anios: 3, fco_bn_anios: 3, banca_tendencia_anios: 2, banca_cet1_margen_pp: 1}
# La spec pide el percentil a 10 años del spread HY, pero FRED solo ofrece 3 años de BAMLH0A0HYM2 (desde 2023-11).
# El etiquetado de crédito usa BAA10Y (spread Baa−10 años, historia desde 2000); el HY se reporta como dato informativo.
macro:
  tipos_umbral_pb: 25
  tipos_ventana_sem: 26
  hy_percentiles: [30, 70]
  credito_serie: BAA10Y
  credito_ventana_anios: 10
  sensibilidad_anios: 3
  max_dias_regimen: 7
  fred: {tipos_10a: DGS10, tipos_2a: DGS2, tipos_3m: DGS3MO, credito: BAA10Y, hy: BAMLH0A0HYM2}
  eurusd_fred: DEXUSEU   # USD por EUR
  # Series FRED de divisas frente al USD, según cómo cotizan.
  fx_divisa_por_usd: {BRL: DEXBZUS, MXN: DEXMXUS, JPY: DEXJPUS, CNY: DEXCHUS, KRW: DEXKOUS, INR: DEXINUS,
                      CAD: DEXCAUS, CHF: DEXSZUS, SEK: DEXSDUS, DKK: DEXDNUS, NOK: DEXNOUS}
  fx_usd_por_divisa: {GBP: DEXUSUK, AUD: DEXUSAL}
  ecb: {estr: "EST/B.EU000A2X2A25.WT", rendimiento_10a: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y"}
# Umbrales del router. Los de ciclicidad y crecimiento son heurísticos (la spec no fija el número).
router: {biotech_ingresos_max_musd: 50, ebit_negativo_min_anios: 2, ebit_ventana_anios: 3, crecimiento_percentil: 90,
         ciclica_desv_margen: 0.05, ciclica_min_anios: 7, holding_min_segmentos: 3, holding_peso_min: 0.15,
         anios_estados_min: 2}
tasas_base: {clases_musd: [100, 500, 2000, 5000, 10000, 50000], ventas_min_musd: 100, winsor: [1, 99],
             anio_inicio: 2009, anio_fin: 2025, z_evidencia: 2, z_imposible: 3}
datos: {discrepancia_max: 0.02, precio_max_dias: 3}

# Checklist (gate.py). Rutas de campos con "/" como separador (las claves de Damodaran contienen puntos).
gate:
  cobertura_bajista_min: 1.5
  cobertura_sin_dato: aviso      # aviso | fallo: qué hacer si no hay gasto por intereses y sí hay deuda
  campos_criticos:
    # Heurística propia (la spec no enumera los campos): lo que el motor y el checklist necesitan para cada ruta.
    _comunes: [precios/precio, precios/precio_eur, precios/fx_eur, damodaran/erp_madura]
    general: [fundamentales/ingresos, fundamentales/beneficio_operativo, fundamentales/acciones_diluidas,
              fundamentales/deuda_total, fundamentales/caja, "damodaran/sector/valores/betas.beta_desapalancada"]
    crecimiento_perdidas: [fundamentales/ingresos, fundamentales/beneficio_operativo, fundamentales/fco,
                           fundamentales/acciones_diluidas, fundamentales/deuda_total, fundamentales/caja,
                           "damodaran/sector/valores/betas.beta_desapalancada"]
    ciclica: [fundamentales/ingresos, fundamentales/beneficio_operativo, fundamentales/acciones_diluidas,
              fundamentales/deuda_total, fundamentales/caja, "damodaran/sector/valores/betas.beta_desapalancada"]
    banco_credito: [fundamentales/ingresos, fundamentales/beneficio_neto, fundamentales/patrimonio,
                    fundamentales/acciones_diluidas, fundamentales/prestamos, fundamentales/depositos]
    # banco_credito exige además el capital: CET1 y su requisito o, si no se publica CET1, el ratio de capital total
    # y su mínimo (gate.capital_bancario).
    biotech_precomercial: [fundamentales/ingresos, fundamentales/fco, fundamentales/caja, fundamentales/deuda_total,
                           fundamentales/acciones_diluidas]
    holding: [fundamentales/ingresos, fundamentales/acciones_diluidas, fundamentales/deuda_total, fundamentales/caja,
              segmentos, "damodaran/sector/valores/betas.beta_desapalancada"]
    fuera_de_alcance: []

# Baselines (baselines.py). B3 compara con el promedio sectorial de Damodaran, que no trae terciles: el umbral
# de "barato" y "caro" es una razón frente a ese promedio (heurístico).
baselines:
  b2: {superior: 0.55, inferior: 0.40}
  b3: {barato: 0.55, medio: 0.45, caro: 0.40}
  razon_barato: 0.8
  razon_caro: 1.2
  b0_e4: 0.5

puntuacion:
  clip_log: [0.02, 0.98]
  min_n_calibracion: 20
  min_n_dm: 10
  h_pasos: {E0: 6, E1: 12, E2: 36, E3: 12, E4: 12}   # solapamiento de las predicciones (cadencia mensual)

diario: {anular_si: [opa, delisting, escision, sin_datos], dias_espera_datos: 7, dias_espera_e4: 20}

# Parámetros operativos de las fuentes de datos.
cache_ttl_horas: {companyfacts: 24, submissions: 24, tickers: 24, precios: 12, damodaran: 720, macro: 168, frames: 720}
edgar: {max_peticiones_seg: 8, anios: 10}
yfinance: {reintentos: 5, espera_base_seg: 2, anios: 5}
damodaran:
  base_url: "https://pages.stern.nyu.edu/~adamodar/pc/datasets/"
  archivo_erp_historica: histimpl.xls
  archivo_primas_pais: ctryprem.xlsx
  # Conjuntos sectoriales: clave -> prefijo del archivo. Región: "" (EE. UU.), Europe, emerg, Global.
  conjuntos: {betas: beta, margenes: margin, roic: EVA, pbv: pbv, ev_ebitda: vebitda, roe: roe, wacc: wacc, capex: capex}
  url_ratings: "https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ratings.htm"
  regiones: {us: "", europa: Europe, emergentes: emerg, global: Global}
  # En EE. UU. algunos archivos no siguen el patrón prefijo+región.
  us_excepciones: {beta: betas, pbv: pbvdata}
